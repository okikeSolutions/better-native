name: Setup build profile
description: Install the Bun workspace and the Node and pnpm toolchain required to materialize pinned Expo

runs:
  using: composite
  steps:
    - name: Setup static profile
      uses: ./.github/actions/setup-static

    - name: Setup pnpm for pinned Expo materialization
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 10.33.0

    - name: Setup external Expo source
      uses: ./.github/actions/setup-expo-source

    - name: Resolve pnpm store
      id: expo-pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Restore pinned Expo pnpm store
      id: expo-pnpm-store-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.expo-pnpm-store.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-node-24-pnpm-10-expo-${{ hashFiles('compatibility/upstreams.json') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-24-pnpm-10-expo-

    - name: Record Expo install cache evidence
      shell: bash
      env:
        CACHE_HIT: ${{ steps.expo-pnpm-store-cache.outputs.cache-hit }}
        CACHE_KEY: ${{ runner.os }}-${{ runner.arch }}-node-24-pnpm-10-expo-${{ hashFiles('compatibility/upstreams.json') }}
      run: |
        echo "BETTER_NATIVE_PNPM_STORE_CACHE_HIT=${CACHE_HIT:-false}" >> "$GITHUB_ENV"
        echo "BETTER_NATIVE_PNPM_STORE_CACHE_KEY=$CACHE_KEY" >> "$GITHUB_ENV"
