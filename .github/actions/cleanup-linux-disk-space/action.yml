name: Cleanup GitHub Linux runner disk space
description: Remove unused preinstalled software before storage-heavy Android compatibility jobs

runs:
  using: composite
  steps:
    - name: Cleanup preinstalled packages
      shell: bash
      run: |
        set -euo pipefail
        echo "Disk space before cleanup"
        df -aH

        readonly total_disk_gb="$(df -BG / | tail -1 | awk '{print $2}' | sed 's/G//')"
        if [ "$total_disk_gb" -ge 100 ]; then
          echo "Large runner disk detected; cleanup is unnecessary."
          exit 0
        fi

        # Keep this aligned with the pinned Expo runner cleanup. These are
        # preinstalled runner tools, not repository or compatibility evidence.
        sudo apt-get remove -y --purge \
          '^mysql-.*' '^mongodb-.*' '^mssql-.*' '^postgresql-.*' \
          '^aspnetcore-*' '^dotnet-.*' '^php.*-.*' 'mono-complete' \
          '^llvm-.*' 'powershell' 'google-chrome-*' 'microsoft-edge-*' \
          'firefox' 'nginx' 'apache2' 'ghc' '^ghc-*'
        sudo apt-get autoremove -y
        sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc
        docker system prune -af || true

        echo "Disk space after cleanup"
        df -aH
