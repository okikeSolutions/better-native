name: Setup better-native
description: Install the pinned Bun toolchain and workspace dependencies

inputs:
  generate:
    description: Generate compatibility artifacts and the application registry
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup pnpm for pinned Expo materialization
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 10

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Generate compatibility inputs
      if: inputs.generate == 'true'
      shell: bash
      run: bun run generate
