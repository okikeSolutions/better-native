name: Use Android emulator
description: Run compatibility tests on an Expo-aligned, hardware-accelerated Android emulator

inputs:
  avd-api:
    description: Android API level used by the AVD
    required: false
    default: "36"
  avd-name:
    description: AVD name
    required: true
  script:
    description: Reviewed compatibility command to run after the emulator boots
    required: true
  working-directory:
    description: Working directory for the compatibility command
    required: false
    default: ./

runs:
  using: composite
  steps:
    - name: Enable KVM for Android virtualization
      shell: bash
      run: |
        set -euo pipefail
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Android emulator attempt 1
      id: attempt-1
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ inputs.avd-api }}
        avd-name: ${{ inputs.avd-name }}
        arch: x86_64
        disable-animations: true
        target: google_apis
        profile: pixel_7_pro
        disk-size: 4G
        emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        script: |
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell input keyevent 3
          ${{ inputs.script }}
        working-directory: ${{ inputs.working-directory }}

    - name: Preserve compatibility failure from attempt 1
      if: steps.attempt-1.outcome == 'failure' && hashFiles('.artifacts/runs/**/flow.yaml') != ''
      shell: bash
      run: exit 1

    - name: Android emulator attempt 2
      id: attempt-2
      continue-on-error: true
      if: steps.attempt-1.outcome == 'failure' && hashFiles('.artifacts/runs/**/flow.yaml') == ''
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ inputs.avd-api }}
        avd-name: ${{ inputs.avd-name }}
        arch: x86_64
        disable-animations: true
        target: google_apis
        profile: pixel_7_pro
        disk-size: 4G
        emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        script: |
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell input keyevent 3
          ${{ inputs.script }}
        working-directory: ${{ inputs.working-directory }}

    - name: Preserve compatibility failure from attempt 2
      if: steps.attempt-2.outcome == 'failure' && hashFiles('.artifacts/runs/**/flow.yaml') != ''
      shell: bash
      run: exit 1

    - name: Android emulator attempt 3
      id: attempt-3
      if: steps.attempt-2.outcome == 'failure' && hashFiles('.artifacts/runs/**/flow.yaml') == ''
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ inputs.avd-api }}
        avd-name: ${{ inputs.avd-name }}
        arch: x86_64
        disable-animations: true
        target: google_apis
        profile: pixel_7_pro
        disk-size: 4G
        emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        script: |
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell input keyevent 3
          ${{ inputs.script }}
        working-directory: ${{ inputs.working-directory }}
