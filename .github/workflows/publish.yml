name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: npm package to publish
        required: true
        type: choice
        options:
          - network
          - battery
          - clipboard
          - keep-awake
          - secure-store
          - cli

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  local-registry-matrix:
    name: Local-registry installation matrix
    if: github.repository == 'okikeSolutions/better-native' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Prove transient CLI installation shapes through a local registry
        run: bun run test:local-registry

  build:
    name: Build and verify package
    needs: local-registry-matrix
    if: github.repository == 'okikeSolutions/better-native' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CAPABILITY: ${{ inputs.package }}
    outputs:
      artifact-name: ${{ steps.pack.outputs.artifact-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Run repository checks
        run: bun run check

      - name: Pack verified package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          package_root="packages/${CAPABILITY}"
          test -f "${package_root}/package.json"
          artifact_root="${RUNNER_TEMP}/npm-artifact"
          mkdir -p "${artifact_root}"
          artifact_name="$(npm pack --silent --pack-destination "${artifact_root}" "./${package_root}")"
          test -n "${artifact_name}"
          test -f "${artifact_root}/${artifact_name}"
          test "$(find "${artifact_root}" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          echo "artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ inputs.package }}
          path: ${{ runner.temp }}/npm-artifact/${{ steps.pack.outputs.artifact-name }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish package
    needs: build
    if: github.repository == 'okikeSolutions/better-native' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      DIST_TAG: alpha
      EXPECTED_ARTIFACT: ${{ needs.build.outputs.artifact-name }}
    steps:
      - name: Setup Node and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify trusted-publishing npm version
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)' "${npm_version}"

      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ inputs.package }}
          path: ${{ runner.temp }}/npm-artifact

      - name: Publish with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/npm-artifact/${EXPECTED_ARTIFACT}"
          test -n "${EXPECTED_ARTIFACT}"
          test -f "${artifact}"
          test "$(find "${RUNNER_TEMP}/npm-artifact" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          npm publish "${artifact}" --access public --tag "${DIST_TAG}"
