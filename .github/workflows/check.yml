name: Check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      eval-task:
        description: Deterministic DX task to run, or all
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  fast:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup build profile
        uses: ./.github/actions/setup-build

      - name: Run the local fast contract
        run: bun run check:fast

      - name: Run pinned-Expo integration tests
        env:
          BETTER_NATIVE_INTEGRATION_SUITE: harness
        run: bun run test:integration

  process-boundaries:
    name: Process-boundary checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EVAL_TASK: ${{ inputs.eval-task || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup static profile
        uses: ./.github/actions/setup-static

      - name: Setup DX eval prerequisites once
        uses: ./.github/actions/setup-dx-evals

      - name: Run process-boundary integration suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in published compile-contracts isolation trials task-workspace; do
            BETTER_NATIVE_INTEGRATION_SUITE="$suite" bun run test:integration
          done

      - name: Validate deterministic controls
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVAL_TASK" = all ]; then
            bun run evals validate
          else
            bun run evals validate --task "$EVAL_TASK"
          fi

      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dx-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/evals
          if-no-files-found: warn
          retention-days: 3

  required:
    name: Verification required
    if: always()
    needs: [fast, process-boundaries]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification lane
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          PROCESS_RESULT: ${{ needs.process-boundaries.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$PROCESS_RESULT" = success
