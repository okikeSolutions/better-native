name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  verification:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build profile
        uses: ./.github/actions/setup-build

      - name: Run the local fast contract
        run: bun run check:fast

      - name: Setup DX eval prerequisites
        uses: ./.github/actions/setup-dx-evals

      - name: Run selected integration suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in published harness compile-contracts isolation trials task-workspace; do
            echo "::group::Integration: $suite"
            BETTER_NATIVE_INTEGRATION_SUITE="$suite" bun run test:integration
            echo "::endgroup::"
          done

      - name: Validate every ledger capability's deterministic controls
        shell: bash
        run: |
          set -euo pipefail
          jq -er '.capabilities | length > 0' compatibility/capabilities.json > /dev/null
          jq -r '.capabilities[].id' compatibility/capabilities.json | while IFS= read -r capability; do
            echo "::group::DX controls: $capability"
            bun run evals validate --task "$capability"
            echo "::endgroup::"
          done

      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dx-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/evals
          if-no-files-found: warn
          retention-days: 7

  required:
    name: Verification required
    if: always()
    needs: verification
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected verification lane
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: |
          test "$VERIFICATION_RESULT" = success
