name: Feature proposal
description: Propose a new capability or a meaningful change to better-native.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Strong proposals begin with a concrete user need. For large or architectural changes, open an issue early so the direction can be agreed before implementation.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New Effect-native package or API
        - Expo compatibility
        - Metro or module resolution
        - Compatibility suite or harness
        - Developer experience or tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who is affected, what are they trying to accomplish, and what prevents them today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the public behavior or contributor experience you would like to see. Include a small API example when useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note any expected differences from Expo, platform-specific behavior, migration concerns, or changes to the compatibility denominator.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, prior art, screenshots, or implementation notes that clarify the proposal.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for related proposals.
          required: true
        - label: I described the problem independently of the proposed implementation.
          required: true
